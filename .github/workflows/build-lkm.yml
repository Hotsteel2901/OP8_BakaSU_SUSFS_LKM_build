name: Build 4.19 FinaSU LKM Kernel + SUSFS-LKM (OnePlus 8 / LOS 23.2)

# 基于本仓库 master（管理器 = BakaSU）改造：
#   - 管理器换成 FinaSU（LyraVoid/FinaSU）
#   - 内核模块仍外置（CONFIG_KSU=m），ramdisk 注入 FinaSU 的 ksuinit + kernelsu.ko
#   - 额外构建 4.19 的 SUSFS-LKM（Hotsteel2901/susfs4ksu-lkm legacy + 本仓库补丁）
# 产出：
#   - boot.img（header v2，已注入 FinaSU ksuinit + kernelsu.ko）
#   - kernelsu.ko（FinaSU LKM 驱动）
#   - susfs_guard_lkm.ko（SUSFS-LKM，运行时加载）
#   - susfs-lkm-module.zip（开机自动 insmod 的 KernelSU 模块）
#
# 关键点：FinaSU 内核模块用 APK 签名（DER 大小 + SHA-256）认证管理器。
# 工作流默认从最新 FinaSU Release 的 APK 里提取签名证书，并作为
# KSU_EXPECTED_SIZE2 / KSU_EXPECTED_HASH2 编进 LKM；否则官方管理器不会
# 被识别为 manager（root 授权界面打不开）。可显式覆盖。

on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: 'Base boot.img URL (v2 header, OnePlus 8 / kebab / LOS 23.2)'
        required: false
        type: string
      kernel_commit:
        description: 'Kernel ref to pull: branch or commit SHA (default: lineage-23.2 = latest)'
        required: false
        type: string
        default: 'lineage-23.2'
      patch_base:
        description: 'Fallback kernel commit if DS/RK patches fail on latest'
        required: false
        type: string
        default: '4238ee49a84b'
      manager_ref:
        description: 'FinaSU ref (latest = newest GitHub release; or a tag/branch/commit)'
        required: false
        type: string
        default: 'latest'
      manager_apk_url:
        description: 'FinaSU manager APK URL (default: the release APK matching manager_ref/latest)'
        required: false
        type: string
      manager_cert_size:
        description: 'Override manager signing cert size (hex, e.g. 0x02cc); requires manager_cert_hash'
        required: false
        type: string
      manager_cert_hash:
        description: 'Override manager signing cert SHA-256; requires manager_cert_size'
        required: false
        type: string
      susfs_enable:
        description: 'Integrate SUSFS-LKM (default on; off = build kernel + FinaSU LKM only)'
        required: true
        type: boolean
        default: true
      susfs_lkm_ref:
        description: 'SUSFS-LKM ref (branch/tag/commit) to pull'
        required: false
        type: string
        default: 'legacy'
      vfs_hybridmount:
        description: 'VFS backend: Hybrid Mount (mutually exclusive with NoMount)'
        required: false
        type: boolean
        default: false
      vfs_nomount:
        description: 'VFS backend: NoMount (mutually exclusive with Hybrid Mount)'
        required: false
        type: boolean
        default: false

env:
  # Device
  DEVICE: 'OnePlus 8 (instantnoodle)'
  KERNEL_SOURCE: 'https://github.com/LineageOS/android_kernel_oneplus_sm8250.git'
  KERNEL_BRANCH: 'lineage-23.2'
  KERNEL_REF: ${{ inputs.kernel_commit || 'lineage-23.2' }}
  PATCH_BASE: ${{ inputs.patch_base || '4238ee49a84b' }}

  # Manager = FinaSU. LKM mode: CONFIG_KSU=m.
  MANAGER_SOURCE: 'https://github.com/LyraVoid/FinaSU.git'
  MANAGER_REF: ${{ inputs.manager_ref || 'latest' }}
  MANAGER_APK_URL: ${{ inputs.manager_apk_url || '' }}
  MANAGER_CERT_SIZE: ${{ inputs.manager_cert_size || '' }}
  MANAGER_CERT_HASH: ${{ inputs.manager_cert_hash || '' }}

  # SUSFS-LKM 源码（legacy 分支面向 pre-5.10；4.19 适配见 Patches/SUSFS-LKM/）
  SUSFS_LKM_SOURCE: 'https://github.com/Hotsteel2901/susfs4ksu-lkm.git'
  SUSFS_LKM_REF: ${{ inputs.susfs_lkm_ref || 'legacy' }}

  BOOT_IMG_URL: ${{ inputs.boot_img_url || '' }}

  # NoMount VFS backend，锁定已验证 commit（不跟 dev 头部，保证可复现）。
  NOMOUNT_COMMIT: 'a159c0c225e67f180b7fb55ad78a77b0f98beb5b'

  # Toolchain
  CLANG: clang
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-
  LIBCLANG_PATH: /usr/lib/llvm-18/lib
  JOBS: '4'

jobs:
  build-lkm:
    name: 'Build FinaSU LKM boot.img + SUSFS-LKM'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:

      - name: Checkout repo (patches & tools)
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 libclang-18-dev \
            gcc-aarch64-linux-gnu gcc-x86-64-linux-gnu \
            cpio zstd python3 bc bison flex libssl-dev zip unzip
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/lib/llvm-18/lib/libclang.so.1 /usr/lib/llvm-18/lib/libclang.so
          clang --version | head -1

      - name: Setup Rust (stable; ksuinit + host ksud)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-unknown-linux-musl
          rustc --version
          cargo --version

      - name: Resolve FinaSU ref + manager signing certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api() {
            if [ -n "${GH_TOKEN:-}" ]; then
              curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$@"
            else
              curl -fsSL "$@"
            fi
          }

          if [ "$MANAGER_REF" = "latest" ]; then
            REL=$(api https://api.github.com/repos/LyraVoid/FinaSU/releases/latest)
            MANAGER_REF=$(printf '%s' "$REL" | python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')
            echo "[+] latest FinaSU release: $MANAGER_REF"
          fi
          echo "MANAGER_REF=$MANAGER_REF" >> "$GITHUB_ENV"

          if [ -n "$MANAGER_CERT_SIZE" ] || [ -n "$MANAGER_CERT_HASH" ]; then
            if [ -z "$MANAGER_CERT_SIZE" ] || [ -z "$MANAGER_CERT_HASH" ]; then
              echo "::error::manager_cert_size and manager_cert_hash must be set together"
              exit 1
            fi
            echo "[i] using manager certificate override"
            echo "KSU_EXPECTED_SIZE2=$MANAGER_CERT_SIZE" >> "$GITHUB_ENV"
            echo "KSU_EXPECTED_HASH2=$MANAGER_CERT_HASH" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ -z "$MANAGER_APK_URL" ]; then
            # Prefer the APK from the selected release; fall back to latest for
            # branches/commits that have no release of their own.
            REL=$(api "https://api.github.com/repos/LyraVoid/FinaSU/releases/tags/$MANAGER_REF" 2>/dev/null || \
                  api https://api.github.com/repos/LyraVoid/FinaSU/releases/latest)
            MANAGER_APK_URL=$(printf '%s' "$REL" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next((a["browser_download_url"] for a in d.get("assets",[]) if a.get("name","").endswith(".apk")), ""))')
            if [ -z "$MANAGER_APK_URL" ]; then
              echo "[i] selected release has no APK asset, using the latest release APK for the certificate"
              REL=$(api https://api.github.com/repos/LyraVoid/FinaSU/releases/latest)
              MANAGER_APK_URL=$(printf '%s' "$REL" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next((a["browser_download_url"] for a in d.get("assets",[]) if a.get("name","").endswith(".apk")), ""))')
            fi
          fi
          if [ -z "$MANAGER_APK_URL" ]; then
            echo "::error::Cannot find a FinaSU manager APK. Pass manager_apk_url or manager_cert_size/hash."
            exit 1
          fi

          echo "[+] manager APK: $MANAGER_APK_URL"
          curl -fsSL --retry 3 "$MANAGER_APK_URL" -o /tmp/finasu-manager.apk
          python3 "$GITHUB_WORKSPACE/tools/apk_cert.py" /tmp/finasu-manager.apk --env >> "$GITHUB_ENV"
          echo "[+] trusted manager certificate:"
          grep -E '^KSU_EXPECTED_(SIZE2|HASH2)=' "$GITHUB_ENV" | tail -2

      - name: Clone kernel (latest by default)
        run: |
          git clone --depth=1 --single-branch -b "$KERNEL_BRANCH" "$KERNEL_SOURCE" device_kernel
          cd device_kernel
          if git cat-file -e "$KERNEL_REF^{commit}" 2>/dev/null; then
            git checkout -q "$KERNEL_REF"
          else
            git fetch -q --depth=1 origin "$KERNEL_REF"
            git checkout -q "$KERNEL_REF"
          fi
          echo "kernel HEAD: $(git rev-parse HEAD)"

      - name: Clone FinaSU (manager)
        run: |
          # A plain clone cannot use --branch for a commit SHA, so initialise and
          # fetch the requested ref explicitly. Works for release tags, branches
          # and reachable commit SHAs.
          mkdir finasu
          cd finasu
          git init -q
          git remote add origin "$MANAGER_SOURCE"
          git fetch -q --depth=1 origin "$MANAGER_REF"
          git checkout -q FETCH_HEAD
          # Kbuild derives KSU_VERSION from `git rev-list --count HEAD`; a
          # shallow clone reports 1 (KSU_VERSION=30001), which makes the
          # manager show a bogus/outdated LKM version.  Fetch the full history.
          git fetch -q --unshallow origin 2>/dev/null || true
          echo "manager HEAD: $(git rev-parse HEAD) ($MANAGER_REF), commits: $(git rev-list --count HEAD)"
          grep -n 'KERNEL_SU_UAPI_VERSION' kernel/include/uapi/supercall.h | head -2

      - name: Apply FinaSU 4.19 compatibility patches
        run: |
          cd finasu
          # 见 Patches/FinaSU-419/README.md。按文件名顺序应用。
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/Patches/FinaSU-419/*.patch; do
            echo "[+] applying $(basename "$p")"
            patch -p1 < "$p" || { echo "::error::$(basename "$p") failed to apply"; exit 1; }
          done
          if [ -n "$(find . -name '*.rej')" ]; then
            echo "::error::FinaSU compat patches left .rej files:"; find . -name '*.rej'; exit 1
          fi

      - name: Clone SUSFS-LKM + apply 4.19 adaptation patches
        if: inputs.susfs_enable
        run: |
          git clone --depth=1 --single-branch -b "$SUSFS_LKM_REF" "$SUSFS_LKM_SOURCE" susfs_lkm
          cd susfs_lkm
          echo "SUSFS-LKM HEAD: $(git rev-parse HEAD) ($SUSFS_LKM_REF)"
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/Patches/SUSFS-LKM/*.patch; do
            echo "[+] applying $(basename "$p")"
            patch -p1 < "$p" || { echo "::error::$(basename "$p") failed to apply"; exit 1; }
          done
          if [ -n "$(find . -name '*.rej')" ]; then
            echo "::error::SUSFS-LKM patches left .rej files:"; find . -name '*.rej'; exit 1
          fi

      - name: Validate VFS backend selection (mutually exclusive)
        run: |
          HM="${{ inputs.vfs_hybridmount }}"
          NM="${{ inputs.vfs_nomount }}"
          HM="${HM:-false}"
          NM="${NM:-false}"

          COUNT=0
          [ "$HM" = "true" ] && COUNT=$((COUNT + 1))
          [ "$NM" = "true" ] && COUNT=$((COUNT + 1))

          echo "VFS backend selection:"
          echo "  VFS_HYBRIDMOUNT = $HM"
          echo "  VFS_NOMOUNT     = $NM"

          if [ "$COUNT" -gt 1 ]; then
            echo "[-] ERROR: VFS backends are mutually exclusive, but $COUNT are enabled."
            exit 1
          fi

          if [ "$COUNT" -eq 0 ]; then
            echo "[i] No VFS backend selected - building without path redirection."
            VFS_LABEL=""
          else
            echo "[+] VFS backend check passed."
            if [ "$HM" = "true" ]; then VFS_LABEL="hybridmount"; fi
            if [ "$NM" = "true" ]; then VFS_LABEL="nomount"; fi
          fi

          if [ -n "$VFS_LABEL" ]; then
            echo "VFS_LABEL=-$VFS_LABEL" >> $GITHUB_ENV
          else
            echo "VFS_LABEL=" >> $GITHUB_ENV
          fi
          echo "[+] Artifact suffix will be: '${VFS_LABEL:-(none)}'"

          if [ "${{ inputs.susfs_enable }}" = "true" ]; then
            echo "SUSFS_LABEL=" >> $GITHUB_ENV
            echo "[i] SUSFS-LKM enabled (will build susfs_guard_lkm.ko)."
          else
            echo "SUSFS_LABEL=-nosusfs" >> $GITHUB_ENV
            echo "[i] SUSFS-LKM disabled - building kernel + FinaSU LKM only."
          fi

      - name: Patch kernel - ReKernel-X + DroidSpaces (auto-fallback to verified base)
        run: |
          cd device_kernel
          apply_patches() {
            patch -p1 < "$GITHUB_WORKSPACE/Patches/RekernelX/rkx-4.19.patch" && \
            patch -p1 < "$GITHUB_WORKSPACE/Patches/Droidspaces/cgroup.patch"
          }
          if apply_patches; then
            echo "[+] RKX/DS patches applied on $(git rev-parse HEAD) (latest)"
          else
            echo "[!] patches failed on latest, resetting and falling back to verified base $PATCH_BASE"
            git checkout -f -q . ; git clean -fd -q ; git reset -q --hard
            git fetch -q --depth=1 origin "$PATCH_BASE"
            git checkout -q "$PATCH_BASE"
            apply_patches || { echo "::error::patches also failed on $PATCH_BASE"; exit 1; }
            echo "[+] RKX/DS patches applied on $PATCH_BASE (verified base)"
          fi
          grep -q "rekernel_x" drivers/Makefile || printf "\nobj-\$(CONFIG_REKERNEL_X) += rekernel_x/\n" >> drivers/Makefile
          grep -q 'rekernel_x' drivers/Kconfig || sed -i "/endmenu/i\source \"drivers/rekernel_x/Kconfig\"" drivers/Kconfig
          echo "-g$(git rev-parse --short HEAD)-hotsteel-FinaSU-LKM" > .scmversion
          echo "[+] scmversion: $(cat .scmversion)"

      - name: DroidSpaces cgroup prefix fix check
        run: |
          cd device_kernel
          if grep -qF 'cft->ss && (cgrp->root->flags & CGRP_ROOT_NOPREFIX)' kernel/cgroup/cgroup.c; then
            echo "[+] cgroup file-prefix handling present (DroidSpaces patch applied)."
          else
            echo "[-] cgroup file-prefix handling missing!"
            false
          fi

      - name: Patch HybridMount VFS Subsystem
        if: inputs.vfs_hybridmount == true
        run: |
          cd device_kernel
          cp "$GITHUB_WORKSPACE/Patches/HybridMount/hybridmount_patch_to_4.19.patch" ./
          patch -p1 < hybridmount_patch_to_4.19.patch
          rm -f hybridmount_patch_to_4.19.patch
          find . -name "*.orig" -delete
          if [ -n "$(find . -name '*.rej')" ]; then
            echo "[-] hybridmount_patch has rejected hunks:"; find . -name "*.rej"; false
          fi
          test -f fs/hybridmount/hybridmount.c
          grep -qF 'obj-$(CONFIG_HYBRIDMOUNT) += hybridmount/' fs/Makefile
          grep -qF 'source "fs/hybridmount/Kconfig"' fs/Kconfig
          echo "[+] Hybrid Mount VFS subsystem patched (built-in)."

      - name: Patch NoMount VFS Subsystem
        if: inputs.vfs_nomount == true
        run: |
          cd device_kernel
          curl -sSL "https://raw.githubusercontent.com/maxsteeel/nomount/${NOMOUNT_COMMIT}/kernel/setup.sh" | bash -s "$NOMOUNT_COMMIT"
          find . -name "*.orig" -delete
          test -d fs/nomount
          test -f fs/nomount/nomount.c
          grep -q "nomount" fs/Makefile
          grep -q "fs/nomount/Kconfig" fs/Kconfig
          echo "[+] NoMount VFS subsystem patched (built-in, commit ${NOMOUNT_COMMIT})."

      - name: Generate kernel config (defconfig + oplus + droidspaces, no LTO/CFI, kprobes on)
        run: |
          cd device_kernel
          export OUT="$PWD/out"
          mkdir -p "$OUT"
          make O="$OUT" CC=clang ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- vendor/kona-perf_defconfig
          MAKEFLAGS="CC=clang ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-" \
            scripts/kconfig/merge_config.sh -m -O "$OUT" "$OUT/.config" \
              arch/arm64/configs/vendor/oplus.config \
              "$GITHUB_WORKSPACE/Patches/Droidspaces/droidspaces.config"
          # FinaSU LKM 依赖：
          #   - KPROBES/KRETPROBES：syscall tracepoint 注册计数、SELinux/文件 hook
          #   - FTRACE_SYSCALLS/TRACEPOINTS：sys_enter tracepoint（4.19 上验证可用）
          #   - MODULES/MODVERSIONS：外置 kernelsu.ko
          # 必须关 LTO/CFI：非 CFI 的 .ko 在 CFI 内核上首次间接调用即 panic。
          ./scripts/config --file "$OUT/.config" \
            -e LTO_NONE -d LTO_CLANG -d THINLTO -d CFI_CLANG -d CFI_CLANG_SHADOW \
            -e REKERNEL_X \
            -e KALLSYMS -e KALLSYMS_ALL \
            -e KPROBES -e KRETPROBES -e FTRACE -e FTRACE_SYSCALLS -e TRACEPOINTS

          case "$VFS_LABEL" in
            -hybridmount)
              echo "CONFIG_KEYS=y" >> "$OUT/.config"
              echo "CONFIG_ASSOCIATIVE_ARRAY=y" >> "$OUT/.config"
              echo "CONFIG_HYBRIDMOUNT=y" >> "$OUT/.config"
              ;;
            -nomount)
              echo "CONFIG_KEYS=y" >> "$OUT/.config"
              echo "CONFIG_ASSOCIATIVE_ARRAY=y" >> "$OUT/.config"
              echo "CONFIG_NOMOUNT=y" >> "$OUT/.config"
              ;;
            *)
              echo "[i] No VFS backend requested - skipping VFS CONFIG entries."
              ;;
          esac

          make O="$OUT" CC=clang ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          echo "=== key config after olddefconfig ==="
          grep -E "^CONFIG_(KSU|LTO|CFI|MODULES|MODVERSIONS|KPROBES|KRETPROBES|FTRACE_SYSCALLS|REKERNEL_X|SECURITY_SELINUX)=" "$OUT/.config" || true

          for k in CONFIG_KPROBES CONFIG_KRETPROBES CONFIG_MODULES CONFIG_KALLSYMS_ALL; do
            grep -qE "^${k}=y" "$OUT/.config" || { echo "[-] ${k} not enabled (required by FinaSU LKM)"; false; }
          done

          case "$VFS_LABEL" in
            -hybridmount)
              grep -qE '^CONFIG_HYBRIDMOUNT=y' "$OUT/.config" || { echo "[-] CONFIG_HYBRIDMOUNT did not stick"; false; }
              grep -qE '^CONFIG_KEYS=y' "$OUT/.config" || { echo "[-] CONFIG_KEYS missing"; false; }
              ;;
            -nomount)
              grep -qE '^CONFIG_NOMOUNT=y' "$OUT/.config" || { echo "[-] CONFIG_NOMOUNT did not stick"; false; }
              grep -qE '^CONFIG_KEYS=y' "$OUT/.config" || { echo "[-] CONFIG_KEYS missing"; false; }
              ;;
          esac

      - name: Prepare kernel for out-of-tree module build
        run: |
          cd device_kernel
          export OUT="$PWD/out"
          make O="$OUT" CC=clang ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- -j"$JOBS" modules_prepare
          make O="$OUT" CC=clang ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- init/version.o
          make O="$OUT" CC=clang ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- security/selinux/avc.o
          ls -la "$OUT/include/generated/compile.h" "$OUT/security/selinux/flask.h"

      - name: Build kernel Image (full tree — FinaSU / SUSFS-LKM need vmlinux + Module.symvers)
        run: |
          cd device_kernel
          export OUT="$PWD/out"
          make O="$OUT" CC=clang ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- -j"$JOBS" Image
          ls -la "$OUT/arch/arm64/boot/Image" "$OUT/vmlinux"
          ./scripts/extract-ikconfig "$OUT/arch/arm64/boot/Image" 2>/dev/null | grep -E "^CONFIG_(LTO|CFI|KPROBES|KRETPROBES|MODVERSIONS)" || true

      - name: Build ksuinit (static musl, for ramdisk injection)
        run: |
          cd finasu
          # FinaSU's ksuinit is a separate workspace member.  Build a static
          # aarch64-musl binary: it must run before /system/bin/init, without
          # any Android linker or /system libraries.
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
          set +e; set -o pipefail
          cargo build -p ksuinit --target=aarch64-unknown-linux-musl --release -j"$JOBS" 2>&1 | tee /tmp/ksuinit_build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::ksuinit build failed (rc=$rc)"
            grep -nE 'error\[|^error:|cannot find|failed to|not found|does not have' /tmp/ksuinit_build.log | tail -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          mkdir -p userspace/ksud/bin/aarch64
          cp target/aarch64-unknown-linux-musl/release/ksuinit userspace/ksud/bin/aarch64/ksuinit
          file userspace/ksud/bin/aarch64/ksuinit

      - name: Build host ksud (boot-patch tool, embeds ksuinit)
        run: |
          cd finasu
          # The host ksud embeds ../ksud/bin/aarch64/ksuinit at compile time; it
          # is used only to patch the boot image in CI.
          set +e; set -o pipefail
          cargo build -p ksud --release -j"$JOBS" 2>&1 | tee /tmp/ksud_build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::host ksud build failed (rc=$rc)"
            grep -nE 'error\[|^error:|cannot find|failed to|not found|does not have' /tmp/ksud_build.log | tail -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          ./target/release/ksud --version

      - name: Build FinaSU LKM driver (kernelsu.ko)
        run: |
          cd finasu/kernel
          # LKM 模式：CONFIG_KSU=m，外置模块针对刚构建的 4.19 内核树。
          # KSU_EXPECTED_SIZE2/HASH2 让内核信任官方 FinaSU 管理器 APK 的签名；
          # KSU_SECOND_SIGNATURE_RELEASE=1 表示第二个签名槽是发布证书。
          set +e; set -o pipefail
          make -C "$GITHUB_WORKSPACE/device_kernel" O="$GITHUB_WORKSPACE/device_kernel/out" M="$PWD" \
            CONFIG_KSU=m \
            KSU_EXPECTED_SIZE2="$KSU_EXPECTED_SIZE2" \
            KSU_EXPECTED_HASH2="$KSU_EXPECTED_HASH2" \
            KSU_SECOND_SIGNATURE_RELEASE=1 \
            CC=clang ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$JOBS" modules 2>&1 | tee /tmp/ksu_build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::FinaSU kernelsu.ko build failed (rc=$rc)"
            grep -nE 'error:|fatal error:|Error [0-9]|undefined reference|No such file|No rule to make' /tmp/ksu_build.log | tail -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          ls -la kernelsu.ko
          strings kernelsu.ko | grep -m1 '^vermagic' || true

      - name: Build SUSFS-LKM (susfs_guard_lkm.ko)
        if: inputs.susfs_enable
        run: |
          cd susfs_lkm/kernel
          set +e; set -o pipefail
          make -C "$GITHUB_WORKSPACE/device_kernel" O="$GITHUB_WORKSPACE/device_kernel/out" M="$PWD" \
            CC=clang ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$JOBS" modules 2>&1 | tee /tmp/susfs_build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::SUSFS-LKM build failed (rc=$rc) — see Patches/SUSFS-LKM/README.md"
            grep -nE 'error:|fatal error:|Error [0-9]|undefined reference|No such file|No rule to make|incompatible|implicit declaration' /tmp/susfs_build.log | tail -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          ls -la susfs_guard_lkm.ko

      - name: Verify external modules (unresolved symbols + vermagic)
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/device_kernel/out"
          SYMS="$OUT/System.map"
          if [ ! -f "$SYMS" ]; then
            echo "[i] System.map missing, generating from vmlinux"
            aarch64-linux-gnu-nm -n "$OUT/vmlinux" > "$SYMS"
          fi
          awk '{print $3}' "$SYMS" | grep -v '^$' | sort -u > /tmp/kernel_syms.txt
          UTS=$(sed -n 's/^#define UTS_RELEASE "\(.*\)"/\1/p' "$OUT/include/generated/utsrelease.h")
          echo "[i] kernel release: $UTS"

          check_ko() {
            ko="$1"
            name=$(basename "$ko")
            echo "=== $name ==="
            vm=$(strings "$ko" | sed -n 's/^vermagic=//p' | head -1)
            echo "[i] vermagic: $vm"
            case "$vm" in
              "$UTS "*) ;;
              *) echo "::error::$name vermagic does not match kernel release '$UTS'"; return 1 ;;
            esac
            aarch64-linux-gnu-nm -u "$ko" | awk '$1 == "U" {print $2}' | sort -u > /tmp/${name}.undef
            missing=$(comm -23 /tmp/${name}.undef /tmp/kernel_syms.txt || true)
            if [ -n "$missing" ]; then
              echo "::error::$name references symbols missing from the kernel:"
              echo "$missing" | while IFS= read -r s; do echo "::error::  $s"; done
              echo "::error::ksuinit/ksud cannot resolve these from /proc/kallsyms; init_module() will fail."
              return 1
            fi
            echo "[+] all $(wc -l < /tmp/${name}.undef) undefined symbols resolved"
          }

          check_ko "$GITHUB_WORKSPACE/finasu/kernel/kernelsu.ko"
          if [ "${{ inputs.susfs_enable }}" = "true" ]; then
            check_ko "$GITHUB_WORKSPACE/susfs_lkm/kernel/susfs_guard_lkm.ko"
          fi

      - name: Package SUSFS-LKM KernelSU module (susfs-lkm-module.zip)
        if: inputs.susfs_enable
        run: |
          rm -rf mod_stage
          mkdir -p mod_stage
          cp "$GITHUB_WORKSPACE"/susfs-module/module.prop mod_stage/
          cp "$GITHUB_WORKSPACE"/susfs-module/post-fs-data.sh mod_stage/
          cp "$GITHUB_WORKSPACE"/susfs-module/service.sh mod_stage/
          cp susfs_lkm/kernel/susfs_guard_lkm.ko mod_stage/
          chmod 755 mod_stage/*.sh
          ko_desc=$(strings mod_stage/susfs_guard_lkm.ko | sed -n 's/^description=//p' | head -1)
          echo "[i] susfs_guard_lkm.ko modinfo: ${ko_desc:-<none>}"
          rm -f susfs-lkm-module.zip
          ( cd mod_stage && zip -r9 "$GITHUB_WORKSPACE/susfs-lkm-module.zip" . )
          unzip -l "$GITHUB_WORKSPACE/susfs-lkm-module.zip"

      - name: Obtain base boot.img (v2)
        run: |
          mkdir -p base_out
          if [ -n "$BOOT_IMG_URL" ]; then
            echo "[+] Downloading base boot.img from URL"
            curl -fsSL "$BOOT_IMG_URL" -o base_out/boot.img
          elif [ -f "base/boot.img" ]; then
            echo "[+] Using repo base/boot.img"
            cp base/boot.img base_out/boot.img
          else
            echo "::error::No base boot.img. Provide boot_img_url input or commit base/boot.img"
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/tools/boot_info.py" base_out/boot.img

      - name: Swap kernel + inject FinaSU LKM into boot.img
        run: |
          mkdir -p out_img
          python3 "$GITHUB_WORKSPACE/tools/swap_kernel.py" \
            base_out/boot.img \
            device_kernel/out/arch/arm64/boot/Image \
            out_img/swapped.img
          # FinaSU 的 boot-patch 参数：--boot/--module/--out，输出
          # kernelsu_patched_<timestamp>.img；Patches 0004 放行 OnePlus 8 的 v2 头。
          finasu/target/release/ksud boot-patch \
            --boot out_img/swapped.img \
            --module finasu/kernel/kernelsu.ko \
            --out out_img/
          ls -la out_img/

      - name: Verify final boot.img
        run: |
          python3 "$GITHUB_WORKSPACE/tools/boot_info.py" out_img/kernelsu_patched_*.img

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-patched-finasu-lkm${{ env.VFS_LABEL }}${{ env.SUSFS_LABEL }}
          path: |
            out_img/kernelsu_patched_*.img
            finasu/kernel/kernelsu.ko
            susfs_lkm/kernel/susfs_guard_lkm.ko
            susfs-lkm-module.zip
          if-no-files-found: error
